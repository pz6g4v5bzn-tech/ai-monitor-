name: Gemini Current State Review

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/gemini-current-review.yml"
      - "gemini_current_review_full.py"

permissions:
  contents: read

concurrency:
  group: gemini-current-state-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai==3.8.0 requests==2.34.2

      - name: Send fresh CODEBLACK evidence to Gemini and Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_HOOK: ${{ secrets.DISCORD_HOOK }}
        run: python gemini_current_review_full.py
