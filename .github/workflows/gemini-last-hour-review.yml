name: CODEBLACK Last-Hour Gemini GPT Review

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/gemini-last-hour-review.yml"

permissions:
  contents: read

concurrency:
  group: codeblack-last-hour-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai==3.8.0 requests==2.34.2

      - name: Run last-hour Gemini GPT review and post to Discord
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_HOOK: ${{ secrets.DISCORD_HOOK }}
          OPENAI_MODEL: gpt-5.6-sol
          GEMINI_MODEL: gemini-3.6-flash
        run: python gemini_last_hour_review.py
