name: CODEBLACK Gemini Evidence Correction

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/gemini-last-hour-correction.yml"

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai==3.8.0 requests==2.34.2
      - name: Correct Gemini review and post to Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_HOOK: ${{ secrets.DISCORD_HOOK }}
        run: python gemini_last_hour_correction.py
