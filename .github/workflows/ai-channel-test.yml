name: AI Monitor Production Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ai-channel-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai==3.8.0 requests==2.34.2

      - name: Run repaired production monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_HOOK: ${{ secrets.DISCORD_HOOK }}
          TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
          TARGET_REPO: pz6g4v5bzn-tech/evidence-desk-lab
          OPENAI_MODEL: gpt-5.6-sol
          GEMINI_MODEL: gemini-3.6-flash
        run: python run_audit.py
